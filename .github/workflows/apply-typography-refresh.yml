name: Apply elegant typography refresh

on:
  push:
    branches: [main]
    paths:
      - "assets/css/elegant-typography.css"
      - "scripts/apply_typography_refresh.py"
      - ".github/workflows/apply-typography-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typography-refresh
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply typography across generated pages
        run: python scripts/apply_typography_refresh.py

      - name: Verify homepage integration
        run: |
          test -f assets/css/elegant-typography.css
          grep -Fq '/assets/css/elegant-typography.css' index.html
          grep -Fq 'fonts.googleapis.com/css2?family=Manrope' index.html
          grep -Fq '/assets/css/elegant-typography.css' scripts/build_site.py

      - name: Commit generated typography integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' scripts/build_site.py
          if git diff --cached --quiet; then
            echo "Typography integration is already current."
            exit 0
          fi
          git commit -m "Apply elegant typography across the live website [skip ci]"
          git push origin HEAD:main
