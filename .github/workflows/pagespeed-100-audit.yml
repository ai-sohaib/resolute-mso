name: Perfect PageSpeed Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "llms.txt"
      - "scripts/finalize_pagespeed_100.py"
      - "scripts/enforce_perfect_lighthouse.js"
      - ".github/workflows/pagespeed-100-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proposed website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install current Lighthouse
        run: |
          npm install --global lighthouse@latest
          lighthouse --version

      - name: Apply final production optimization
        run: python3 scripts/finalize_pagespeed_100.py

      - name: Validate final production output
        run: |
          grep -Fq 'data:image/png;base64' index.html
          grep -Fq 'platform-logo-officeally' index.html
          grep -Fq '[Resolute MSO home](https://www.resolutemso.com/)' llms.txt
          ! grep -Fq 'mailto:' index.html
          ! grep -Fq 'google.com/s2/favicons' index.html
          ! grep -Fq 'href="/assets/css/pagespeed-home.css"' index.html

      - name: Start local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/resolute-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/resolute-http.log
          exit 1

      - name: Run mobile Lighthouse
        run: lighthouse http://127.0.0.1:4173/ --output=json --output-path=lighthouse-mobile.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet

      - name: Run desktop Lighthouse
        run: lighthouse http://127.0.0.1:4173/ --preset=desktop --output=json --output-path=lighthouse-desktop.json --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet

      - name: Enforce 100 scores and Agentic Browsing 3/3
        run: node scripts/enforce_perfect_lighthouse.js

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-pagespeed-reports
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json
          retention-days: 14
