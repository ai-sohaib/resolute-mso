# Baseline and optimization gate for the restored production source.
name: PageSpeed 100 Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "config.js"
      - "site.webmanifest"
      - ".github/workflows/pagespeed-100-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Lighthouse
        run: npm install --global lighthouse@12

      - name: Start local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/resolute-http.log 2>&1 &
          echo $! > /tmp/resolute-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/resolute-http.log
          exit 1

      - name: Run mobile Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --output=json \
            --output-path=./lighthouse-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Run desktop Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --output=json \
            --output-path=./lighthouse-desktop.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Print scores and every failing weighted audit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reports = [
            ['MOBILE', JSON.parse(fs.readFileSync('lighthouse-mobile.json', 'utf8'))],
            ['DESKTOP', JSON.parse(fs.readFileSync('lighthouse-desktop.json', 'utf8'))],
          ];
          let failed = false;
          for (const [label, report] of reports) {
            console.log(`\n========== ${label} ==========`);
            for (const [id, category] of Object.entries(report.categories)) {
              const score = Math.round((category.score || 0) * 100);
              console.log(`${id}: ${score}`);
              if (score < 100) failed = true;
              const refs = category.auditRefs.filter(ref => ref.weight > 0);
              for (const ref of refs) {
                const audit = report.audits[ref.id];
                if (!audit || audit.score === 1 || audit.scoreDisplayMode === 'notApplicable') continue;
                console.log(`FAIL [${id}] ${ref.id}: ${audit.title}`);
                if (audit.displayValue) console.log(`  ${audit.displayValue}`);
                if (audit.description) console.log(`  ${audit.description.replace(/\s+/g, ' ')}`);
                const items = audit.details && Array.isArray(audit.details.items) ? audit.details.items.slice(0, 12) : [];
                for (const item of items) {
                  const summary = [item.node && item.node.selector, item.node && item.node.snippet, item.url, item.source, item.failureSummary]
                    .filter(Boolean).join(' | ').replace(/\s+/g, ' ');
                  if (summary) console.log(`  ITEM ${summary}`);
                }
              }
            }
          }
          if (failed) {
            console.error('\nOne or more Lighthouse categories are below 100.');
            process.exit(1);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json
          retention-days: 14
