name: Enterprise Website QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/source-cleanup.js
          node --check assets/js/enterprise-upgrade.js
          node --check workers/lead-intake/src/index.js
      - name: Verify no plaintext secrets are committed
        run: |
          ! grep -RInE '(RESEND_API_KEY|SMTP_PASSWORD|PRIVATE_KEY)[[:space:]]*=' --exclude='*.md' --exclude='*.example' .
      - name: Generate enterprise static site
        run: python scripts/build_enterprise_site.py
      - name: Verify generated homepage acceptance criteria
        run: |
          python - <<'PY'
          import html
          from pathlib import Path
          exact = "AI-Driven Medical Billing & RCM That Stops Revenue Leakage"
          page = Path("index.html").read_text(encoding="utf-8")
          title = html.unescape(page.split("<title>", 1)[1].split("</title>", 1)[0])
          h1_start = page.index("<h1")
          h1 = html.unescape(page[page.index(">", h1_start) + 1:page.index("</h1>", h1_start)])
          assert title == exact, f"Generated title mismatch: {title!r}"
          assert h1 == exact, f"Generated H1 mismatch: {h1!r}"
          assert "/assets/css/enterprise-upgrade.css" in page, "Enterprise CSS missing"
          assert 'src="/config.js' in page, "Central configuration missing"
          assert "One operating partner across the revenue cycle" in page, "Enterprise hero panel missing"
          assert "Healthcare revenue, automation, technology, and staffing" in page, "Enterprise capability structure missing"
          print("Generated homepage acceptance checks passed.")
          PY
      - name: Run repository validator
        run: python scripts/validate_site.py
      - name: Install browser for visual evidence
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture before-and-after evidence
        run: |
          python -m http.server 8080 > /tmp/resolute-preview.log 2>&1 &
          sleep 2
          python scripts/capture_before_after.py
      - name: Upload generated preview and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: resolute-mso-enterprise-preview
          path: |
            index.html
            assets/
            */index.html
            404.html
            artifacts/visual-evidence/
          retention-days: 14
