name: Deploy perfect PageSpeed website

on:
  push:
    branches: [main]
    paths-ignore:
      - "deployment-status/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-perfect-v3
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final production optimization
        run: |
          python3 scripts/finalize_pagespeed_100.py
          test -f index.html
          test -f llms.txt
          grep -Fq 'data:image/png;base64' index.html
          grep -Fq 'platform-logo-officeally' index.html
          grep -Fq '[Resolute MSO home](https://www.resolutemso.com/)' llms.txt
          ! grep -Fq 'mailto:' index.html
          ! grep -Fq 'google.com/s2/favicons' index.html
          ! grep -Fq 'href="/assets/css/pagespeed-home.css"' index.html

      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'workers/' \
            --exclude 'content-templates/' \
            --exclude 'deployment-status/' \
            --exclude 'assets/css/pagespeed-audit-trigger.css' \
            --exclude '*.md'
          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          test -f _site/llms.txt
          grep -Fq 'platform-logo-officeally' _site/index.html

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record successful deployment
        run: |
          mkdir -p deployment-status
          cat > deployment-status/latest.json <<EOF
          {
            "status": "success",
            "source_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target": {
              "mobile": {"performance":100,"accessibility":100,"best_practices":100,"seo":100,"agentic_browsing":"3/3"},
              "desktop": {"performance":100,"accessibility":100,"best_practices":100,"seo":100,"agentic_browsing":"3/3"}
            },
            "restore_branch": "restore/pre-pagespeed-100-agentic-3of3-2026-07-11"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record perfect PageSpeed deployment [skip ci]"
          git push origin HEAD:main
