name: Deploy optimized website v2

on:
  push:
    branches: [main]
    paths-ignore:
      - "deployment-status/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-platform-logo-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build optimized website with platform logos
        run: |
          echo "Forcing platform-logo deployment from ${GITHUB_SHA}"
          python -m pip install --disable-pip-version-check pillow
          python scripts/apply_pagespeed_100.py
          python scripts/apply_platform_logos.py
          test -f index.html
          test -f assets/css/pagespeed-home.css
          test -f assets/img/healthcare-hero-ai-420.webp
          test -f assets/img/healthcare-hero-ai-720.webp
          grep -Fq '/assets/img/resolute-mso-logo.webp' index.html
          grep -Fq 'platform-logo-strip' index.html
          grep -Fq 'domain=eclinicalworks.com' index.html
          grep -Fq 'domain=telcor.com' index.html

      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'workers/' \
            --exclude 'content-templates/' \
            --exclude 'deployment-status/' \
            --exclude 'assets/css/pagespeed-audit-trigger.css' \
            --exclude '*.md'
          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          test -f _site/assets/css/pagespeed-home.css
          grep -Fq 'platform-logo-strip' _site/index.html

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record successful deployment
        run: |
          mkdir -p deployment-status
          cat > deployment-status/latest.json <<EOF
          {
            "status": "success",
            "source_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "change": "Materialized platform logos deployed from root source",
            "restore_branch": "restore/pre-platform-logo-deploy-2026-07-08"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record materialized platform logo deployment [skip ci]"
          git push origin HEAD:main
