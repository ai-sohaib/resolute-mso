name: Deploy Resolute MSO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build enterprise website
        run: python scripts/build_enterprise_site.py

      - name: Validate generated website
        run: |
          python scripts/validate_site.py
          python -m unittest discover -s tests -p "test_*.py" -v
          node --check assets/js/source-cleanup.js
          node --check assets/js/enterprise-upgrade.js
          node --check assets/js/whatsapp-normalize.js
          node --check workers/lead-intake/src/index.js

      - name: Prepare production artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='workers/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='data/' \
            --exclude='artifacts/' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='*.zip'
          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          grep -Fq 'AI-Driven Medical Billing &amp; RCM That Stops Revenue Leakage' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v5
