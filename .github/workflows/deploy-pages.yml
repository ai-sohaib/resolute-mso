name: Deploy PSI 100 and Agentic-Ready Website

on:
  push:
    branches: [main]
    paths-ignore:
      - "deployment-status/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-psi-agentic-100
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build and audit tools
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --global lighthouse@latest

      - name: Build optimized and agentic-ready website
        run: |
          python scripts/apply_pagespeed_100.py
          python scripts/apply_platform_logos.py
          python scripts/apply_agentic_readiness.py
          python -m py_compile scripts/apply_pagespeed_100.py scripts/apply_platform_logos.py scripts/apply_agentic_readiness.py
          node --check assets/js/agentic-readiness.js
          test -s index.html
          test -s robots.txt
          test -s llms.txt
          test -s assets/css/pagespeed-home.css
          test -s assets/img/healthcare-hero-ai-420.webp
          test -s assets/img/healthcare-hero-ai-720.webp
          grep -Fq '/assets/img/platforms/officeally.webp' index.html
          grep -Fq '/assets/img/platforms/telcor.webp' index.html
          grep -Fq '/assets/js/agentic-readiness.js' index.html
          grep -Fq 'resolute-agent-schema' index.html
          ! grep -Fq 'www.google.com/s2/favicons' index.html
          for logo in officeally eclinicalworks carecloud nextgen athenahealth advancedmd modmed telcor; do
            test -s "assets/img/platforms/${logo}.webp"
          done

      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'workers/' \
            --exclude 'content-templates/' \
            --exclude 'deployment-status/' \
            --exclude 'diagnostics/' \
            --exclude 'assets/css/pagespeed-audit-trigger.css' \
            --exclude '*.md'
          touch _site/.nojekyll
          test -s _site/CNAME
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/llms.txt
          test -s _site/assets/js/agentic-readiness.js
          test -s _site/assets/img/platforms/officeally.webp

      - name: Serve staged production artifact
        run: |
          cd _site
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/resolute-deploy-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/resolute-deploy-preview.log
          exit 1

      - name: Validate mobile Lighthouse 100
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --output=json --output-path=lighthouse-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet

      - name: Validate desktop Lighthouse 100
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --output=json --output-path=lighthouse-desktop.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet

      - name: Enforce all standard category scores
        run: |
          node <<'NODE'
          const fs = require('fs');
          const required = ['performance','accessibility','best-practices','seo'];
          const scores = {};
          let failed = false;
          for (const device of ['mobile','desktop']) {
            const report = JSON.parse(fs.readFileSync(`lighthouse-${device}.json`, 'utf8'));
            scores[device] = {};
            for (const id of required) {
              const score = Math.round((report.categories[id].score || 0) * 100);
              scores[device][id] = score;
              console.log(`${device} ${id}: ${score}`);
              if (score !== 100) {
                failed = true;
                for (const ref of report.categories[id].auditRefs || []) {
                  const audit = report.audits[ref.id];
                  if (!audit || ref.weight <= 0 || audit.score === 1 || audit.scoreDisplayMode === 'notApplicable') continue;
                  console.log(`FAIL ${ref.id}: ${audit.title} ${audit.displayValue || ''}`);
                }
              }
            }
          }
          fs.writeFileSync('validated-scores.json', JSON.stringify(scores));
          if (failed) process.exit(1);
          NODE

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record successful deployment
        run: |
          mkdir -p deployment-status
          SCORES=$(cat validated-scores.json)
          cat > deployment-status/latest.json <<EOF
          {
            "status": "success",
            "source_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "validated_lighthouse": ${SCORES},
            "agentic_readiness": ["llms.txt", "robots.txt", "structured-data", "WebMCP"],
            "restore_branch": "restore/pre-psi-agentic-100-2026-07-11"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PSI 100 and agentic-ready deployment [skip ci]"
          git push origin HEAD:main
