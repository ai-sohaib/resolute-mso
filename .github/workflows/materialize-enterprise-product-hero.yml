name: Materialize enterprise product hero

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_enterprise_product_hero.py"
      - "assets/css/enterprise-product-hero.css"
      - "assets/js/enterprise-product-hero.js"
      - ".github/workflows/materialize-enterprise-product-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-enterprise-product-hero
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply enterprise product hero
        run: |
          python3 scripts/apply_enterprise_product_hero.py
          grep -Fq 'Revenue Cycle Intelligence Built for Modern Healthcare' index.html
          grep -Fq 'data-rcm-dashboard' index.html
          grep -Fq 'enterprise-product-hero.css' index.html
          grep -Fq 'enterprise-product-hero.js' index.html
          ! grep -Fq 'healthcare-hero-ai' index.html

      - name: Commit live homepage source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Enterprise product hero is already materialized."
            exit 0
          fi
          git commit -m "Materialize enterprise healthcare SaaS hero"
          git push origin HEAD:main
