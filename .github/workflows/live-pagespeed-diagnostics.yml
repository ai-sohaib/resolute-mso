name: Live PageSpeed Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/diagnose_live_pagespeed.js"
      - ".github/workflows/live-pagespeed-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest Lighthouse and browser tooling
        run: |
          npm install --global lighthouse@latest
          npm install puppeteer-core@latest
          google-chrome --version
          lighthouse --version

      - name: Run Lighthouse against live mobile site
        run: |
          lighthouse https://www.resolutemso.com/ \
            --output=json \
            --output-path=live-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Run Lighthouse against live desktop site
        run: |
          lighthouse https://www.resolutemso.com/ \
            --preset=desktop \
            --output=json \
            --output-path=live-desktop.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Extract failures and scrape PSI Agentic details
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/diagnose_live_pagespeed.js

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pagespeed-diagnostics
          path: |
            live-mobile.json
            live-desktop.json
            live-pagespeed-diagnostics.txt
            psi-*
          retention-days: 14
